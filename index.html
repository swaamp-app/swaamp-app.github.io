<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Swaamp — independent software in the making.">
  <meta name="theme-color" content="#e8e7df">
  <title>Swaamp — Coming soon</title>
  <style>
    :root {
      --paper: #e8e7df;
      --paper-light: #f2f1e9;
      --ink: #1b1b19;
      --muted: #65645e;
      --line: rgba(27, 27, 25, .28);
      --page-width: min(1120px, calc(100% - 40px));
    }

    * { box-sizing: border-box; }

    html { color-scheme: light; }

    body {
      min-height: 100svh;
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      content: "";
      pointer-events: none;
      opacity: .22;
      background:
        repeating-linear-gradient(0deg, rgba(27,27,25,.08) 0 1px, transparent 1px 4px),
        radial-gradient(circle, rgba(27,27,25,.17) 0 .6px, transparent .8px) 0 0 / 5px 5px;
      mix-blend-mode: multiply;
    }

    .page {
      width: var(--page-width);
      min-height: 100svh;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header, footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      border-color: var(--line);
    }

    header { min-height: 76px; border-bottom: 1px solid var(--line); }
    footer { padding: 22px 0 28px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }

    .brand {
      color: var(--ink);
      text-decoration: none;
      font-size: 23px;
      font-weight: 900;
      letter-spacing: -.08em;
    }

    .label, .footer-note {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    main {
      display: grid;
      place-items: center;
      padding: 72px 0;
      text-align: center;
    }

    .message {
      width: min(680px, 100%);
      padding: clamp(36px, 7vw, 76px) clamp(24px, 7vw, 74px);
      border: 1px solid var(--ink);
      background: rgba(242, 241, 233, .68);
      box-shadow: 9px 9px 0 var(--ink);
    }

    .eyebrow { margin: 0 0 26px; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; }

    h1 {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
      font-size: clamp(54px, 10vw, 108px);
      line-height: .88;
      letter-spacing: -.09em;
      text-transform: uppercase;
    }

    h1 span { display: block; color: transparent; -webkit-text-stroke: 1.5px var(--ink); }

    .copy {
      max-width: 430px;
      margin: 30px auto 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .mark {
      width: 44px;
      height: 44px;
      margin: 38px auto 0;
      display: grid;
      place-items: center;
      border: 2px solid var(--ink);
      border-radius: 50%;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
      font-size: 21px;
      font-weight: 900;
      transform: rotate(-8deg);
    }

    @media (max-width: 560px) {
      :root { --page-width: calc(100% - 26px); }
      header { min-height: 66px; }
      .label { font-size: 9px; }
      main { padding: 44px 0 58px; }
      .message { box-shadow: 6px 6px 0 var(--ink); }
      footer { align-items: flex-start; flex-direction: column; gap: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="brand" href="./" aria-label="Swaamp, home">Swaamp</a>
      <span class="label">indie software / in the making</span>
    </header>

    <main>
      <section class="message" aria-labelledby="coming-soon-title">
        <p class="eyebrow">SWAAMP 01 — in progress</p>
        <h1 id="coming-soon-title">Coming <span>soon</span></h1>
        <p class="copy">We are making something small, strange, and carefully considered. This page is taking shape too.</p>
        <div class="mark" aria-hidden="true">S</div>
      </section>
    </main>

    <footer>
      <span>© 2026 Swaamp</span>
      <span class="footer-note">a page in progress</span>
    </footer>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swaamp</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 80%, rgba(20,40,20,0.6) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(10,25,15,0.4) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(5,15,8,0.8) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  .container {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 3rem;
  }
  .title {
    font-family: 'Special Elite', 'Courier New', monospace;
    font-size: clamp(4rem, 12vw, 8rem);
    color: #c8b89a;
    letter-spacing: 0.15em;
    line-height: 1;
  }
  .subtitle {
    font-family: 'Special Elite', 'Courier New', monospace;
    font-size: clamp(0.9rem, 2vw, 1.1rem);
    color: #5a6b52;
    letter-spacing: 0.4em;
    margin-top: 1.5rem;
    text-transform: uppercase;
  }
  .cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: #5a6b52;
    margin-left: 4px;
    vertical-align: middle;
    animation: blink 1.1s step-end infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
  .domain {
    font-family: 'Special Elite', 'Courier New', monospace;
    font-size: 0.75rem;
    color: #2e3d2a;
    letter-spacing: 0.3em;
    margin-top: 3rem;
  }
</style>
</head>
<body>
<div class="container">
  <div class="title">swaamp</div>
  <div class="subtitle">coming soon<span class="cursor"></span></div>
  <div class="domain">swaamp.app</div>
</div>
</body>
</html>
